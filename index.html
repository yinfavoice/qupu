<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公开课福利【曲谱+回放】</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "SimHei", sans-serif; background: #f5f5f5; user-select: none; -webkit-user-select: none; }
  .container { display: flex; width: 100vw; height: 100vh; height: 100dvh; --sb-w: 160px; position: relative; }

  /* 左侧目录 */
  .sidebar {
    width: var(--sb-w); min-width: 100px; max-width: 360px;
    height: 100vh; height: 100dvh; flex-shrink: 0;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; display: flex; flex-direction: column; overflow: hidden;
    z-index: 100; position: relative;
  }
  .sidebar-header {
    padding: calc(var(--sb-w) * 0.1) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.06);
    text-align: center; flex-shrink: 0;
  }
  .sidebar-header h2 {
    font-size: calc(var(--sb-w) * 0.065); font-weight: 600;
    letter-spacing: 0.5px; color: #e94560;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-header p {
    font-size: calc(var(--sb-w) * 0.07); color: rgba(255,255,255,0.45);
    margin-top: 3px; letter-spacing: 1px;
  }

  .search-box {
    padding: 0 calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.05);
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%; height: 30px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.1); color: #fff;
    padding: 0 10px; font-size: calc(var(--sb-w) * 0.08);
    outline: none; transition: background 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.35); }
  .search-box input:focus { background: rgba(255,255,255,0.18); }

  .song-list { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }

  .singer-header {
    padding: calc(var(--sb-w) * 0.06) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.03) calc(var(--sb-w) * 0.1);
    font-size: calc(var(--sb-w) * 0.095); font-weight: 700;
    color: rgba(255,255,255,0.85); letter-spacing: 0.5px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
    user-select: none;
  }
  .singer-header:first-child { border-top: none; }
  .singer-header .arrow {
    display: inline-block; width: 0; height: 0;
    border-left: 5px solid rgba(255,255,255,0.5);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    transition: transform 0.2s; flex-shrink: 0;
  }
  .singer-header.collapsed .arrow { transform: rotate(-90deg); }
  .singer-header .singer-count {
    font-size: calc(var(--sb-w) * 0.065); font-weight: 400;
    color: rgba(255,255,255,0.35); margin-left: auto;
  }
  .singer-songs { overflow: hidden; transition: max-height 0.25s ease; }
  .singer-songs.collapsed { max-height: 0 !important; }

  .song-item {
    padding: calc(var(--sb-w) * 0.05) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.05) calc(var(--sb-w) * 0.14);
    cursor: pointer; transition: all 0.2s;
    border-left: 3px solid transparent;
    display: flex; align-items: baseline; gap: calc(var(--sb-w) * 0.04);
  }
  .song-item:hover { background: rgba(255,255,255,0.08); }
  .song-item.active { background: rgba(233,69,96,0.15); border-left-color: #e94560; }
  .song-item .si-date {
    font-size: calc(var(--sb-w) * 0.07); color: rgba(255,255,255,0.35);
    flex-shrink: 0; white-space: nowrap;
  }
  .song-item .si-singer {
    font-size: calc(var(--sb-w) * 0.065); color: rgba(255,255,255,0.4);
    flex-shrink: 0; white-space: nowrap; margin-right: 4px;
  }
  .song-item .si-name {
    font-size: calc(var(--sb-w) * 0.09); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .song-item.active .si-name { color: #fff; }
  .no-result {
    padding: 20px; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 12px;
  }

  .resizer {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    background: rgba(255,255,255,0.08);
    transition: background 0.2s; z-index: 20;
  }
  .resizer:hover, .resizer.dragging { background: #e94560; }

  .content-wrapper {
    flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; background: #e8e8e8;
    min-width: 0;
  }
  .content {
    flex: 1; overflow: hidden; position: relative; cursor: grab;
  }
  .content.dragging { cursor: grabbing; }
  .content.annotate { cursor: crosshair; }
  .content.cover { cursor: crosshair; }

  .menu-btn {
    display: none; position: absolute; top: 8px; left: 8px; z-index: 21;
    height: 36px; padding: 0 16px; border: none; border-radius: 18px;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .menu-btn:active { background: #e94560; }
  .mobile-replay-btn {
    display: none; position: absolute; top: 8px; left: 92px; z-index: 21;
    height: 36px; padding: 0 10px; border: none; border-radius: 18px;
    background: rgba(233,69,96,0.85); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 2px 8px rgba(233,69,96,0.3);
  }
  .mobile-replay-btn:active { background: #c73659; }
  .sidebar-backdrop {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45); z-index: 99;
  }
  .sidebar-backdrop.show { display: block; }

  .title-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%);
    padding: 14px 50px 20px 24px; pointer-events: none;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .title-bar.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  .title-bar .tb-song {
    font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 2px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .title-bar .tb-info {
    font-size: 13px; color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .tb-toggle {
    pointer-events: auto; position: absolute; right: 12px; top: 10px;
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
    font-size: 13px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.2s;
  }
  .tb-toggle:hover { background: rgba(255,255,255,0.3); }

  .show-title-btn {
    position: absolute; top: 8px; right: 8px; z-index: 19;
    height: 30px; padding: 0 14px; border: none; border-radius: 15px;
    background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85);
    font-size: 12px; cursor: pointer; display: none; align-items: center;
    white-space: nowrap; transition: background 0.2s;
  }
  .show-title-btn:hover { background: rgba(0,0,0,0.75); }
  .show-title-btn.visible { display: flex; }

  /* 曲谱容器 */
  .score-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .score-page {
    position: absolute; top: 50%; left: 50%;
    background: #fff;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    transition: transform 0.15s ease-out;
    box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    display: none;
  }
  .score-page.active { display: block; }
  .score-page img {
    display: block; max-width: none; max-height: none; pointer-events: none;
  }
  .highlight-layer {
    position: absolute; top: 0; left: 0; pointer-events: none;
  }
  .highlight-layer.interactive { pointer-events: auto; }
  .highlight-rect {
    fill: rgba(255, 220, 50, 0.45);
    stroke: rgba(255, 180, 0, 0.6); stroke-width: 1;
  }
  .cover-rect { fill: #ffffff; stroke: none; }
  .highlight-rect.drawing, .cover-rect.drawing {
    stroke: rgba(255, 100, 100, 0.8); stroke-width: 1.5; stroke-dasharray: 4,2;
  }
  .bottom-pad { width: 100%; background: #fff; }

  .toolbar {
    height: 52px; flex-shrink: 0;
    background: rgba(20,20,20,0.95);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    padding: 0 50px 0 20px; gap: 10px; position: relative;
    transition: transform 0.25s ease, opacity 0.25s ease;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; position: absolute; bottom: 0; left: 0; right: 0; }
  .tb-toolbar-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
    font-size: 13px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.2s;
    flex-shrink: 0;
  }
  .tb-toolbar-toggle:hover { background: rgba(255,255,255,0.25); }

  .show-toolbar-btn {
    position: absolute; bottom: 8px; right: 8px; z-index: 19;
    height: 30px; padding: 0 14px; border: none; border-radius: 15px;
    background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85);
    font-size: 12px; cursor: pointer; display: none; align-items: center;
    white-space: nowrap; transition: background 0.2s;
  }
  .show-toolbar-btn:hover { background: rgba(0,0,0,0.75); }
  .show-toolbar-btn.visible { display: flex; }
  .toolbar button {
    height: 36px; min-width: 36px; padding: 0 10px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.1); color: #fff; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .toolbar button:active { background: rgba(233,69,96,0.4); }
  .toolbar button.active { background: #e94560; color: #fff; }
  .toolbar button.cover-active { background: #333; color: #fff; border: 1px solid #fff; }
  .toolbar .zoom-label {
    color: rgba(255,255,255,0.7); font-size: 13px; min-width: 48px; text-align: center; flex-shrink: 0;
  }
  .toolbar .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.15); margin: 0 4px; flex-shrink: 0; }

  .song-list::-webkit-scrollbar { width: 4px; }
  .song-list::-webkit-scrollbar-track { background: transparent; }
  .song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  /* 直播回放区域 - 侧边栏底部 */
  .replay-section {
    flex-shrink: 0; padding: 8px; border-top: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.2);
  }
  .replay-btn {
    width: 100%; padding: 10px 8px; border: none; border-radius: 6px;
    background: linear-gradient(135deg, #e94560 0%, #c73659 100%);
    color: #fff; font-size: calc(var(--sb-w) * 0.085); font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(233,69,96,0.3);
  }
  .replay-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,69,96,0.4); }
  .replay-btn:active { transform: translateY(0); background: #c73659; }

  /* 视频弹窗 */
  .video-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 10000;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .video-modal.open { display: flex; }
  .video-modal-inner {
    width: 100%; max-width: 900px; background: #000; border-radius: 10px;
    overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
  }
  .video-modal-head {
    padding: 14px 18px; background: #1a1a2e; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .video-modal-head h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .video-modal-close {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .video-modal-close:hover { background: #e94560; }
  .video-player-wrap {
    position: relative; width: 100%; padding-top: 56.25%; background: #000;
  }
  .video-player-wrap iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: none;
  }
  .video-list-panel {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 10001;
    align-items: center; justify-content: center; padding: 20px;
  }
  .video-list-panel.open { display: flex; }
  .video-list-inner {
    width: 100%; max-width: 500px; max-height: 80vh; background: #1a1a2e;
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .video-list-head {
    padding: 14px 18px; background: #16213e; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .video-list-head h3 { font-size: 16px; font-weight: 600; }
  .video-list-tip {
    padding: 12px 16px; background: rgba(233,69,96,0.15);
    color: #ff8fa3; font-size: 15px; font-weight: 600; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .video-list-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .video-item {
    padding: 12px 14px; margin: 4px 0; border-radius: 8px;
    background: rgba(255,255,255,0.05); cursor: pointer;
    transition: background 0.15s;
  }
  .video-item:hover { background: rgba(233,69,96,0.2); }
  .video-item .vi-name { color: #fff; font-size: 14px; font-weight: 600; }
  .video-item .vi-meta { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }

  /* ===== 手机端适配 ===== */
  /* ===== 直播工具箱（仅电脑版，Ctrl+H 开关） ===== */
  .tb-resizer {
    width: 6px; flex-shrink: 0; cursor: col-resize; display: none;
    background: rgba(233,69,96,0.35); position: relative; z-index: 50;
  }
  .tb-resizer:hover, .tb-resizer.dragging { background: #e94560; }
  .tb-resizer::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 18px; height: 44px; border-radius: 9px;
    background: rgba(255,255,255,0.25);
  }
  .tb-panel {
    display: none; flex-direction: column; flex-shrink: 0;
    width: 380px; min-width: 280px; max-width: 60vw;
    height: 100vh; height: 100dvh;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; overflow: hidden; z-index: 90;
  }
  body.tb-on .tb-panel { display: flex; }
  body.tb-on .tb-resizer { display: block; }
  body.tb-on .sidebar { display: none; }
  body.tb-on .resizer { display: none; }

  .tb-rows { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 6px 4px; }
  .tb-row { padding: 10px 14px; flex: 1 1 0; min-height: 58px; overflow: hidden; }
  .tb-split { display: flex; align-items: stretch; }
  .tb-half { flex: 1 1 0; min-width: 0; padding: 0 12px; }
  .tb-rh { height: 6px; flex-shrink: 0; cursor: row-resize; margin: 0 12px; border-radius: 3px; background: rgba(255,255,255,0.12); }
  .tb-rh:hover, .tb-rh.dragging { background: #e94560; }
  .tb-cv { width: 6px; flex-shrink: 0; cursor: col-resize; align-self: stretch; margin: 10px 0; border-radius: 3px; background: rgba(255,255,255,0.12); }
  .tb-cv:hover, .tb-cv.dragging { background: #e94560; }

  .tb-label { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
  .tb-label.red { color: #ff7a90; }
  .tb-time { font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tb-time.over { color: #ff4d6a; }
  .tb-name { font-size: 24px; font-weight: 800; color: #fff; line-height: 1.2; }
  .tb-name.over { color: #ff4d6a; }
  .tb-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .tb-word { font-size: 21px; font-weight: 700; color: #fff; line-height: 1.45; margin-top: 6px; white-space: pre-wrap; }
  .tb-word.editable { cursor: pointer; }
  .tb-word.editable:hover { color: #ffd7de; }

  .tb-btn {
    flex: 1; min-width: 70px; padding: 9px 4px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; background: rgba(255,255,255,0.06); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    font-family: inherit; transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.15); }
  .tb-btn.primary { background: #e94560; border-color: #e94560; }
  .tb-btn.primary:hover { background: #d6385a; }
  .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 悬浮小工具板 */
  .tb-float {
    display: none; position: fixed; top: 80px; right: 20px; z-index: 300;
    width: 190px; background: rgba(20,20,38,0.92); border: 1px solid rgba(233,69,96,0.5);
    border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); overflow: hidden;
  }
  body.tb-on .tb-float { display: block; }
  .tb-float-head {
    padding: 8px 12px; background: rgba(233,69,96,0.85); color: #fff;
    font-size: 13px; font-weight: 700; cursor: move; text-align: center;
  }
  .tb-float-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tb-float-body .tb-btn { min-width: 0; padding: 8px 4px; font-size: 12px; }

  /* 工具箱弹窗 */
  .tb-modal {
    display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
  }
  .tb-modal.open { display: flex; }
  .tb-modal-box {
    width: 440px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
    background: #16213e; border: 1px solid rgba(233,69,96,0.6);
    border-radius: 14px; padding: 20px; color: #fff;
  }
  .tb-modal-box h3 { font-size: 18px; color: #e94560; margin-bottom: 14px; }
  .tb-modal-box h4 { font-size: 14px; color: rgba(255,255,255,0.75); margin: 14px 0 8px; }
  .tb-opt {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .tb-opt:hover { background: rgba(255,255,255,0.13); }
  .tb-opt.sel { background: #e94560; border-color: #e94560; font-weight: 700; }
  .tb-min-input {
    width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  .tb-modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  .tb-modal-btns button {
    padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; font-family: inherit;
  }
  .tb-modal-btns .cancel { background: rgba(255,255,255,0.15); color: #fff; }
  .tb-modal-btns .ok { background: #e94560; color: #fff; }
  .tb-del-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,77,106,0.6);
    background: transparent; color: #ff7a90; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .tb-toast {
    position: fixed; bottom: 42px; left: 50%; z-index: 500;
    transform: translateX(-50%) translateY(16px);
    background: rgba(233,69,96,0.95); color: #fff;
    padding: 10px 26px; border-radius: 24px; font-size: 15px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    display: none; box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  .tb-toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px) {
    .sidebar {

<script>
  var songs = [
    { singer: '邓丽君', date: '2026-08-28', name: '甜蜜蜜', info: '庄奴词 · 佚名曲 · 邓丽君演唱', file: 'tianmimi.jpg', original: 'BV1ua4y177vs' },
    { singer: '王菲', date: '2026-08-28', name: '红豆', info: '林夕词 · 陈小霞曲 · 王菲演唱', file: 'hongdou.jpg', original: 'BV1NJ411r7oz' },
    { singer: '邓丽君', date: '2026-08-27', name: '爱的箴言', info: '罗大佑 词曲 · 邓丽君演唱', file: 'aizhenyan.jpg', original: 'BV11HDZYrEeC' },
    { singer: '李健', date: '2026-08-27', name: '人间共鸣', info: '董玉方作词 · 钱雷作曲 · 李健演唱', file: 'renjiangongming.jpg', original: 'BV1BFZLBDEGP' }
  ];

  // 直播回放视频列表（后续添加新视频只需在这里追加）
  var replays = [
    { name: '8月28日直播回放', date: '2026-08-28', duration: '1小时55分', bv: 'BV1qu4k6HE9z' },
    { name: '8月27日直播回放', date: '2026-08-27', duration: '2小时6分', bv: 'BV1P8tc6SEBb' },
    { name: '8月26日直播回放', date: '2026-08-26', duration: '1小时56分', bv: 'BV1Y9tc6AEFu' },
    { name: '8月21日直播回放', date: '2026-08-21', duration: '2小时6分', bv: 'BV1Wr4y6TEef' },
    { name: '8月14日直播回放', date: '2026-08-14', duration: '2小时6分', bv: 'BV1ec416WE7c' },
    { name: '8月12日直播回放', date: '2026-08-12', duration: '2小时2分', bv: 'BV14a4k6vEVL' },
    { name: '8月7日直播回放', date: '2026-08-07', duration: '2小时5分', bv: 'BV12a4k6vEuL' }
  ];

  var collapsedSingers = {};
  var searchKeyword = '';
  var isMobile = window.innerWidth <= 768;

  // 每首歌独立的元素和数据
  var scorePages = [];
  var scoreImages = [];
  var highlightLayers = [];
  var bottomPads = [];
  var undoStack = songs.map(function() { return []; });
  var highlights = songs.map(function() { return []; });
  var covers = songs.map(function() { return []; });
  var loadedCount = 0;

  var currentSongIndex = 0;
  var currentScale = 1;
  var panX = 0, panY = 0;
  var isDragging = false;
  var currentMode = 'pan';
  var isDrawing = false;
  var drawStartX, drawStartY, currentRect;
  var dragStartX, dragStartY, dragPanStartX, dragPanStartY;
  var MIN_SCALE = 0.3, MAX_SCALE = 8, ZOOM_STEP = 0.2;

  var viewArea = document.getElementById('viewArea');
  var zoomLabel = document.getElementById('zoomLabel');
  var scoreContainer = document.getElementById('scoreContainer');
  var btnAnnotate = document.getElementById('btnAnnotate');
  var btnCover = document.getElementById('btnCover');
  var btnClear = document.getElementById('btnClear');
  var container = document.getElementById('container');
  var resizer = document.getElementById('resizer');
  var searchInput = document.getElementById('searchInput');
  var sidebar = document.getElementById('sidebar');
  var sidebarBackdrop = document.getElementById('sidebarBackdrop');
  var menuBtn = document.getElementById('menuBtn');
  var btnAutoScroll = document.getElementById('btnAutoScroll');
  var scrollSpeedSelect = document.getElementById('scrollSpeed');

  // 创建所有曲谱页面（图片一次性全部加载）
  songs.forEach(function(s, i) {
    var page = document.createElement('div');
    page.className = 'score-page' + (i === 0 ? ' active' : '');

    var img = document.createElement('img');
    img.alt = s.name;
    img.src = s.file;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'highlight-layer');

    var pad = document.createElement('div');
    pad.className = 'bottom-pad';

    page.appendChild(img);
    page.appendChild(svg);
    page.appendChild(pad);
    scoreContainer.appendChild(page);

    scorePages.push(page);
    scoreImages.push(img);
    highlightLayers.push(svg);
    bottomPads.push(pad);

    img.onload = function() {
      svg.setAttribute('width', img.naturalWidth);
      svg.setAttribute('height', img.naturalHeight);
      pad.style.height = Math.max(120, Math.round(img.naturalHeight * 0.15)) + 'px';
      loadedCount++;
      if (i === currentSongIndex) {
        renderAll();
        fitToView();
        // 手机端布局稳定后再适配一次
        if (isMobile) { setTimeout(fitToView, 100); setTimeout(fitToView, 400); }
      }
    };
  });

  function scoreImage() { return scoreImages[currentSongIndex]; }
  function scoreWrapper() { return scorePages[currentSongIndex]; }
  function highlightLayer() { return highlightLayers[currentSongIndex]; }
  function bottomPad() { return bottomPads[currentSongIndex]; }

  function renderSongList() {
    var list = document.getElementById('songList');
    list.innerHTML = '';
    var kw = searchKeyword.trim().toLowerCase();

    // 按日期分组（倒序，最新在前）
    var dateGroups = {};
    var dateOrder = [];
    songs.forEach(function(s, i) {
      if (kw) {
        var hay = (s.singer + ' ' + s.name + ' ' + s.date + ' ' + s.date.substring(5)).toLowerCase();
        if (hay.indexOf(kw) === -1) return;
      }
      if (!dateGroups[s.date]) { dateGroups[s.date] = []; dateOrder.push(s.date); }
      dateGroups[s.date].push({ idx: i, song: s });
    });
    // 最新日期排最前面
    dateOrder.sort().reverse();

    if (dateOrder.length === 0) {
      list.innerHTML = '<div class="no-result">没有找到匹配的曲谱</div>';
      return;
    }

    dateOrder.forEach(function(date) {
      var items = dateGroups[date];
      // 日期头：格式化为 "8月27日"
      var dp = date.split('-');
      var dateLabel = parseInt(dp[1]) + '月' + parseInt(dp[2]) + '日';
      var dateKey = 'date_' + date;
      var isDateCollapsed = collapsedSingers[dateKey] && !kw;

      var dateHeader = document.createElement('div');
      dateHeader.className = 'singer-header';
      dateHeader.style.cssText = 'color:#e94560; font-size:calc(var(--sb-w)*0.1); padding-top:calc(var(--sb-w)*0.08); border-top:1px solid rgba(233,69,96,0.2);';
      if (isDateCollapsed) dateHeader.classList.add('collapsed');
      dateHeader.innerHTML = '<span class="arrow"></span><span>' + dateLabel + '</span><span class="singer-count">' + items.length + '首</span>';
      dateHeader.addEventListener('click', function() {
        collapsedSingers[dateKey] = !collapsedSingers[dateKey];
        renderSongList();
      });
      list.appendChild(dateHeader);

      var dateWrap = document.createElement('div');
      dateWrap.className = 'singer-songs' + (isDateCollapsed ? ' collapsed' : '');

      // 日期下直接列歌曲（歌手名显示在歌名旁，搜索仍可命中）
      items.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'song-item' + (item.idx === currentSongIndex ? ' active' : '');
        div.style.paddingLeft = 'calc(var(--sb-w)*0.12)';
        div.innerHTML = '<span class="si-singer">' + item.song.singer + '</span><span class="si-name">' + item.song.name + '</span>';
        div.addEventListener('click', function() {
          selectSong(item.idx);
          if (isMobile) closeSidebar();
        });
        dateWrap.appendChild(div);
      });

      list.appendChild(dateWrap);
    });
  }

  // 切歌：只切换显示，图片已预加载，零延迟
  function selectSong(idx) {
    if (idx === currentSongIndex) return;
    // 切歌时停止自动下滑
    if (isAutoScrolling) {
      isAutoScrolling = false;
      stopAutoScroll();
      btnAutoScroll.textContent = '▼ 下滑';
      btnAutoScroll.style.background = 'rgba(76,175,80,0.7)';
    }
    currentSongIndex = idx;
    var s = songs[idx];

    // 切换可见页面
    scorePages.forEach(function(p, i) {
      if (i === idx) { p.classList.add('active'); }
      else { p.classList.remove('active'); }
    });

    document.getElementById('tbSong').textContent = s.name;
    document.getElementById('tbInfo').textContent = s.info;
    renderSongList();
    renderAll();
    fitToView();
  }

  // 手机端目录开关
  function openSidebar() { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }
  menuBtn.addEventListener('click', openSidebar);
  sidebarBackdrop.addEventListener('click', closeSidebar);

  window.addEventListener('resize', function() {
    isMobile = window.innerWidth <= 768;
    if (!isMobile) closeSidebar();
    clearTimeout(window._fitTimer);
    window._fitTimer = setTimeout(fitToView, 150);
  });
  window.addEventListener('orientationchange', function() {
    setTimeout(fitToView, 300);
  });

  renderSongList();

  searchInput.addEventListener('input', function() {
    searchKeyword = this.value;
    renderSongList();
  });

  var isResizing = false;
  resizer.addEventListener('mousedown', function(e) {
    if (isMobile) return;
    isResizing = true; resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize'; e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!isResizing) return;
    var w = Math.max(100, Math.min(360, e.clientX));
    container.style.setProperty('--sb-w', w + 'px');
  });
  document.addEventListener('mouseup', function() {
    if (isResizing) { isResizing = false; resizer.classList.remove('dragging'); document.body.style.cursor = ''; }
  });

  function updateTransform(animate) {
    var sw = scoreWrapper();
    sw.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
    sw.style.transform = 'translate(calc(-50% + ' + panX + 'px), calc(-50% + ' + panY + 'px)) scale(' + currentScale + ')';
    zoomLabel.textContent = Math.round(currentScale * 100) + '%';
  }

  function getWrapperSize() {
    return { w: scoreImage().naturalWidth, h: scoreImage().naturalHeight + bottomPad().offsetHeight };
  }

  function clampPan() {
    var ws = getWrapperSize();
    var maxPanX = Math.max(0, (ws.w * currentScale - viewArea.clientWidth) / 2);
    var maxPanY = Math.max(0, (ws.h * currentScale - viewArea.clientHeight) / 2);
    panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
    panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
  }

  function svgEl(name, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (var k in attrs) { el.setAttribute(k, attrs[k]); }
    return el;
  }

  function renderAll() {
    var hl = highlightLayer();
    hl.innerHTML = '';
    covers[currentSongIndex].forEach(function(r) {
      hl.appendChild(svgEl('rect', { x: r.x, y: r.y, width: r.w, height: r.h, class: 'cover-rect' }));
    });
    highlights[currentSongIndex].forEach(function(r) {
      hl.appendChild(svgEl('rect', { x: r.x, y: r.y, width: r.w, height: r.h, class: 'highlight-rect' }));
    });
  }

  function screenToSvg(clientX, clientY) {
    var wr = scoreWrapper().getBoundingClientRect();
    return { x: (clientX - wr.left) / currentScale, y: (clientY - wr.top) / currentScale };
  }

  function setMode(mode) {
    currentMode = mode;
    viewArea.classList.remove('annotate', 'cover');
    btnAnnotate.classList.remove('active');
    btnCover.classList.remove('cover-active');
    highlightLayers.forEach(function(hl) { hl.classList.remove('interactive'); });
    btnClear.style.display = 'none';
    if (mode === 'annotate') {
      viewArea.classList.add('annotate');
      btnAnnotate.classList.add('active');
      btnAnnotate.textContent = '退出';
      btnCover.textContent = '遮盖';
      highlightLayer().classList.add('interactive');
      btnClear.style.display = 'flex';
    } else if (mode === 'cover') {
      viewArea.classList.add('cover');
      btnCover.classList.add('cover-active');
      btnCover.textContent = '退出';
      btnAnnotate.textContent = '标注';
      highlightLayer().classList.add('interactive');
      btnClear.style.display = 'flex';
    } else {
      btnAnnotate.textContent = '标注';
      btnCover.textContent = '遮盖';
    }
  }

  function fitToView() {
    var img = scoreImage();
    if (!img || !img.naturalWidth) return;
    // 手机端需要减去工具栏和歌名栏占用的高度，确保整张谱可见
    var availW = viewArea.clientWidth;
    var availH = viewArea.clientHeight;
    if (isMobile) {
      var tb = document.getElementById('toolbar');
      var titlebar = document.getElementById('titleBar');
      availH = viewArea.clientHeight;
    }
    var padH = bottomPad().offsetHeight;
    var imgH = img.naturalHeight + padH;
    var scaleW = availW / img.naturalWidth;
    var scaleH = availH / imgH;
    currentScale = Math.min(scaleW, scaleH) * 0.96;
    panX = 0; panY = 0;
    updateTransform(true);
  }

  function fillView() {
    var img = scoreImage();
    if (!img.naturalWidth) return;
    currentScale = viewArea.clientWidth / img.naturalWidth;
    panX = 0;
    var ws = getWrapperSize();
    var scaledH = ws.h * currentScale;
    panY = (scaledH - viewArea.clientHeight) / 2;
    if (scaledH <= viewArea.clientHeight) {
      panY = (viewArea.clientHeight - scaledH) / 2 * -1;
    }
    updateTransform(true);

      autoScrollTimer = requestAnimationFrame(scrollStep);

  function fmtClock(sec) {

  }
  function fmtMM(sec) {

  function tbBeep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (var i = 0; i < 3; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        var t = ctx.currentTime + i * 0.5;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      }
    } catch (e) {}
  }

  }

  function openWords() {
    var h = '<h3>话术修改</h3>' +
      '<h4>直播内容话术 <span style="font-size:12px;color:rgba(255,255,255,0.5);">（换行直接按回车）</span></h4>' +
      '<textarea class="tb-min-input" id="tbEditContent" rows="4" style="resize:vertical;line-height:1.5;font-size:' + (tbState.sizes.content || 22) + 'px;white-space:pre-wrap;">' + tbContentWord.replace(/</g, '&lt;') + '</textarea>' +
      '<div style="margin-top:6px;font-size:13px;color:rgba(255,255,255,0.7);">内容字号：<button type="button" id="tbSizeContentDown" style="width:30px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;">A-</button> <span id="tbSizeContentShow" style="display:inline-block;width:44px;text-align:center;">' + (tbState.sizes.content || 22) + '</span> <button type="button" id="tbSizeContentUp" style="width:30px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;">A+</button></div>' +
      '<h4>营销话术 <span style="font-size:12px;color:rgba(255,255,255,0.5);">（换行直接按回车）</span></h4>' +
      '<textarea class="tb-min-input" id="tbEditMkt" rows="4" style="resize:vertical;line-height:1.5;font-size:' + (tbState.sizes.mkt || 22) + 'px;white-space:pre-wrap;">' + tbMktWord.replace(/</g, '&lt;') + '</textarea>' +
      '<div style="margin-top:6px;font-size:13px;color:rgba(255,255,255,0.7);">营销字号：<button type="button" id="tbSizeMktDown" style="width:30px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;">A-</button> <span id="tbSizeMktShow" style="display:inline-block;width:44px;text-align:center;">' + (tbState.sizes.mkt || 22) + '</span> <button type="button" id="tbSizeMktUp" style="width:30px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;">A+</button></div>' +
      '<h4>营销间隔（分钟）</h4>' +
      '<input class="tb-min-input" id="tbEditInterval" type="number" min="1" value="' + tbState.mktInterval + '">' +
      '<div class="tb-modal-btns"><button class="cancel" onclick="closeTbModal()">取消</button>' +
      '<button class="ok" id="tbWordOk">保存</button></div>';
    openTb(h);
    function doSave() {
      var newContent = document.getElementById('tbEditContent').value;
      var newMkt = document.getElementById('tbEditMkt').value;
      var iv = parseInt(document.getElementById('tbEditInterval').value, 10);
      var changed = false;
      if (newContent !== tbContentWord || newMkt !== tbMktWord) changed = true;
      if (iv && iv > 0 && iv !== tbState.mktInterval) changed = true;
      if (changed) tbPushHistory();
      tbContentWord = newContent.trim() ? newContent : tbContentWord;
      tbMktWord = newMkt.trim() ? newMkt : tbMktWord;
      if (iv && iv > 0) tbState.mktInterval = iv;
      tbSave(); tbRender(); closeTbModal();
    }
    document.getElementById('tbWordOk').addEventListener('click', doSave);
    function bindSize(which) {
      var up = document.getElementById('tbSize' + which + 'Up'), dn = document.getElementById('tbSize' + which + 'Down');
      var show = document.getElementById('tbSize' + which + 'Show');
      var ta = document.getElementById(which === 'Content' ? 'tbEditContent' : 'tbEditMkt');
      var key = which === 'Content' ? 'content' : 'mkt';
      up.addEventListener('click', function() {
        var v = Math.min(40, (tbState.sizes[key] || 22) + 1);
        tbState.sizes[key] = v; show.textContent = v; ta.style.fontSize = v + 'px'; tbSave(); tbRender();
      });
      dn.addEventListener('click', function() {
        var v = Math.max(14, (tbState.sizes[key] || 22) - 1);
        tbState.sizes[key] = v; show.textContent = v; ta.style.fontSize = v + 'px'; tbSave(); tbRender();
      });
    }
    bindSize('Content'); bindSize('Mkt');
  }

  // ===== 开播/暂停 =====
  function tbToggleLive(forceStart) {
    if (tbState.liveRunning && !forceStart) {
      tbState.liveAccum += Date.now() - tbState.liveStart;
      tbState.liveStart = 0; tbState.liveRunning = false;
    } else {
      tbState.liveStart = Date.now();
      tbState.liveRunning = true;
    }
    tbSave(); tbRender();
  }

  function mktReset() {
    tbPushHistory();
    tbState.mktStart = tbLiveElapsed();
    tbState.mktNotified = false;
    tbSave(); tbRender();
  }

  // ===== 渲染 =====
  function tbRender() {
    document.getElementById('tbLiveTime').textContent = fmtClock(tbLiveElapsed() / 1000);
    document.getElementById('tbMktIntervalShow').textContent = tbState.mktInterval;
    document.getElementById('tbContentWord').textContent = tbContentWord;
    document.getElementById('tbMktWord').textContent = tbMktWord;
    document.getElementById('tbContentWord').style.fontSize = (tbState.sizes.content || 22) + 'px';
    document.getElementById('tbMktWord').style.fontSize = (tbState.sizes.mkt || 22) + 'px';
    var liveBtn = document.querySelector('#tbFloat [data-fb="live"]');
    if (liveBtn) liveBtn.textContent = tbState.liveRunning ? '暂停' : ((tbState.liveAccum || tbState.liveStart) ? '继续' : '开播/暂停');

    var mktRemain = tbMktRemainSec();
    var mktEl = document.getElementById('tbMktTime');
    if (mktRemain >= tbState.mktInterval * 60 - 1.5 && (tbState.liveStart || tbState.liveAccum)) {
      mktEl.textContent = '该营销了';
      mktEl.classList.add('over');
      if (!tbState.mktNotified && tbState.liveRunning) { tbState.mktNotified = true; tbBeep(); tbSave(); }
    } else {
      mktEl.textContent = fmtMM(mktRemain);
      mktEl.classList.toggle('over', mktRemain < 60);
      if (mktRemain > 60) tbState.mktNotified = false;
    }

    var curName = document.getElementById('tbCurName'), curTime = document.getElementById('tbCurTime');
    var nextName = document.getElementById('tbNextName'), nextTime = document.getElementById('tbNextTime');
    if (tbState.cur) {
      var curRemain = tbState.cur.mins * 60 - (tbLiveElapsed() - (tbState.cur.liveBase || 0)) / 1000;
      curName.textContent = tbState.cur.name;
      var curOver = curRemain < 0;
      curName.classList.toggle('over', curOver);
      curTime.textContent = (curOver ? '超时 ' : '') + fmtMM(curRemain);
      curTime.classList.toggle('over', curOver);
    } else {
      curName.textContent = '未设置'; curName.classList.remove('over');
      curTime.textContent = '--:--'; curTime.classList.remove('over');
    }
    if (tbState.next) {
      nextName.textContent = tbState.next.name;
      nextName.classList.remove('over');
      nextTime.textContent = tbState.next.mins + '分钟';
      nextTime.classList.remove('over');
    } else {
      nextName.textContent = '未设置'; nextName.classList.remove('over');
      nextTime.textContent = '--:--'; nextTime.classList.remove('over');
    }
  }

  // ===== 事件绑定 =====
  document.getElementById('tbContentWord').addEventListener('click', openWords);
  document.getElementById('tbMktWord').addEventListener('click', openWords);

  // 右侧每行大小调整（横向手柄调行高、竖手柄调左右占比），比例自动保存
  function tbSaveLayout() {
    var lay = { rows: [], cols: {} };
    for (var i = 1; i <= 4; i++) {
      var r = document.getElementById('tbRow' + i);
      lay.rows.push(r ? (parseFloat(r.style.flexGrow) || 1) : 1);
    }
    [1, 2].forEach(function(n) {
      var a = document.getElementById('tbR' + n + 'c1'), b = document.getElementById('tbR' + n + 'c2');
      if (a && b) lay.cols['r' + n] = [parseFloat(a.style.flexGrow) || 1, parseFloat(b.style.flexGrow) || 1];
    });
    tbState.layout = lay;
    tbSave();
  }
  function tbApplyLayout() {
    var lay = tbState.layout;
    if (!lay) return;
    if (lay.rows) for (var i = 0; i < 4; i++) {
      var r = document.getElementById('tbRow' + (i + 1));
      if (r && lay.rows[i]) r.style.flexGrow = lay.rows[i];
    }
    if (lay.cols) [1, 2].forEach(function(n) {
      var c = lay.cols['r' + n];
      if (!c) return;
      var a = document.getElementById('tbR' + n + 'c1'), b = document.getElementById('tbR' + n + 'c2');
      if (a && b) { a.style.flexGrow = c[0]; b.style.flexGrow = c[1]; }
    });
  }
  (function() {
    function bindDrag(handle, elA, elB, vertical) {
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        var dragging = true;
        handle.classList.add('dragging');
        document.body.style.cursor = vertical ? 'row-resize' : 'col-resize';
        var startPos = vertical ? e.clientY : e.clientX;
        var sizeA = vertical ? elA.offsetHeight : elA.offsetWidth;
        var sizeB = vertical ? elB.offsetHeight : elB.offsetWidth;
        var total = sizeA + sizeB;
        var MIN = vertical ? 50 : 90;
        function move(ev) {
          if (!dragging) return;
          var d = (vertical ? ev.clientY : ev.clientX) - startPos;
          var na = Math.max(MIN, Math.min(total - MIN, sizeA + d));
          var nb = total - na;
          elA.style.flexGrow = na;
          elB.style.flexGrow = nb;
        }
        function up() {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('dragging');
          document.body.style.cursor = '';
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          tbSaveLayout();
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    }
    document.querySelectorAll('.tb-rh').forEach(function(h) {
      var n = parseInt(h.dataset.row, 10);
      bindDrag(h, document.getElementById('tbRow' + n), document.getElementById('tbRow' + (n + 1)), true);
    });
    [1, 2].forEach(function(n) {
      var row = document.getElementById('tbRow' + n);
      var cv = row.querySelector('.tb-cv');
      if (cv) bindDrag(cv, document.getElementById('tbR' + n + 'c1'), document.getElementById('tbR' + n + 'c2'), false);
    });
  })();

  document.querySelectorAll('#tbFloat [data-fb]').forEach(function(b) {
    b.addEventListener('click', function() {
      var act = b.dataset.fb;
      if (act === 'live') tbToggleLive(false);
      else if (act === 'change') openChange();
      else if (act === 'cur') openSetStep('cur');
      else if (act === 'next') openSetStep('next');
      else if (act === 'mkt') mktReset();
      else if (act === 'word') openWords();
    });
  });

  // 悬浮窗拖动
  (function() {
    var head = document.getElementById('tbFloatHead'), float = document.getElementById('tbFloat');
    var dragging = false, ox = 0, oy = 0;
    head.addEventListener('mousedown', function(e) {
      dragging = true;
      var r = float.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      float.style.right = 'auto'; e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var x = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - ox));
      var y = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - oy));
      float.style.left = x + 'px'; float.style.top = y + 'px';
    });
    document.addEventListener('mouseup', function() { dragging = false; });
  })();

  // 工具箱宽度拖动
  (function() {
    var rz = document.getElementById('tbResizer'), dragging = false;
    rz.addEventListener('mousedown', function(e) {
      if (window.innerWidth <= 768) return;
      dragging = true; rz.classList.add('dragging');
      document.body.style.cursor = 'col-resize'; e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var w = Math.max(280, Math.min(window.innerWidth * 0.6, window.innerWidth - e.clientX));
      tbPanel.style.width = w + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) { dragging = false; rz.classList.remove('dragging'); document.body.style.cursor = ''; }
    });
  })();

  // Ctrl+H 开关
  function tbToggle() {
    if (window.innerWidth <= 768) return;
    document.body.classList.toggle('tb-on');
    if (document.body.classList.contains('tb-on')) closeSidebar();
    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 60);
  }
  document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var inModal = tbModal.classList.contains('open');
    // Ctrl/Cmd + 组合键
    if (e.ctrlKey || e.metaKey) {
      var k = e.key.toLowerCase();
      if (k === 'h') { e.preventDefault(); tbToggle(); return; }
      if (k === 'z' && tag !== 'input' && tag !== 'textarea' && !inModal && document.body.classList.contains('tb-on')) {
        e.preventDefault(); tbUndo(); return;
      }
      return;
    }
    // 弹窗内回车 = 点确认（话术框里回车是换行，不触发）
    if (inModal && e.key === 'Enter' && tag !== 'textarea') {
      var ok = document.getElementById('tbStepOk') || document.getElementById('tbWordOk');
      if (ok) { e.preventDefault(); ok.click(); }
    }
  });

  tbLoad();
  tbApplyLayout();
  tbRender();
  setInterval(tbRender, 1000);
</script>
</body>
</html>
