<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公开课福利【曲谱+回放】</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "SimHei", sans-serif; background: #f5f5f5; user-select: none; -webkit-user-select: none; }
  .container { display: flex; width: 100vw; height: 100vh; height: 100dvh; --sb-w: 160px; position: relative; }

  /* 左侧目录 */
  .sidebar {
    width: var(--sb-w); min-width: 100px; max-width: 360px;
    height: 100vh; height: 100dvh; flex-shrink: 0;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; display: flex; flex-direction: column; overflow: hidden;
    z-index: 100; position: relative;
  }
  .sidebar-header {
    padding: calc(var(--sb-w) * 0.1) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.06);
    text-align: center; flex-shrink: 0;
  }
  .sidebar-header h2 {
    font-size: calc(var(--sb-w) * 0.065); font-weight: 600;
    letter-spacing: 0.5px; color: #e94560;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-header p {
    font-size: calc(var(--sb-w) * 0.07); color: rgba(255,255,255,0.45);
    margin-top: 3px; letter-spacing: 1px;
  }

  .search-box {
    padding: 0 calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.05);
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%; height: 30px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.1); color: #fff;
    padding: 0 10px; font-size: calc(var(--sb-w) * 0.08);
    outline: none; transition: background 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.35); }
  .search-box input:focus { background: rgba(255,255,255,0.18); }

  .song-list { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }

  .singer-header {
    padding: calc(var(--sb-w) * 0.06) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.03) calc(var(--sb-w) * 0.1);
    font-size: calc(var(--sb-w) * 0.095); font-weight: 700;
    color: rgba(255,255,255,0.85); letter-spacing: 0.5px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
    user-select: none;
  }
  .singer-header:first-child { border-top: none; }
  .singer-header .arrow {
    display: inline-block; width: 0; height: 0;
    border-left: 5px solid rgba(255,255,255,0.5);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    transition: transform 0.2s; flex-shrink: 0;
  }
  .singer-header.collapsed .arrow { transform: rotate(-90deg); }
  .singer-header .singer-count {
    font-size: calc(var(--sb-w) * 0.065); font-weight: 400;
    color: rgba(255,255,255,0.35); margin-left: auto;
  }
  .singer-songs { overflow: hidden; transition: max-height 0.25s ease; }
  .singer-songs.collapsed { max-height: 0 !important; }

  .song-item {
    padding: calc(var(--sb-w) * 0.05) calc(var(--sb-w) * 0.08) calc(var(--sb-w) * 0.05) calc(var(--sb-w) * 0.14);
    cursor: pointer; transition: all 0.2s;
    border-left: 3px solid transparent;
    display: flex; align-items: baseline; gap: calc(var(--sb-w) * 0.04);
  }
  .song-item:hover { background: rgba(255,255,255,0.08); }
  .song-item.active { background: rgba(233,69,96,0.15); border-left-color: #e94560; }
  .song-item .si-date {
    font-size: calc(var(--sb-w) * 0.07); color: rgba(255,255,255,0.35);
    flex-shrink: 0; white-space: nowrap;
  }
  .song-item .si-singer {
    font-size: calc(var(--sb-w) * 0.065); color: rgba(255,255,255,0.4);
    flex-shrink: 0; white-space: nowrap; margin-right: 4px;
  }
  .song-item .si-name {
    font-size: calc(var(--sb-w) * 0.09); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .song-item.active .si-name { color: #fff; }
  .no-result {
    padding: 20px; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 12px;
  }

  .resizer {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    background: rgba(255,255,255,0.08);
    transition: background 0.2s; z-index: 20;
  }
  .resizer:hover, .resizer.dragging { background: #e94560; }

  .content-wrapper {
    flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; background: #e8e8e8;
    min-width: 0;
  }
  .content {
    flex: 1; overflow: hidden; position: relative; cursor: grab;
  }
  .content.dragging { cursor: grabbing; }
  .content.annotate { cursor: crosshair; }
  .content.cover { cursor: crosshair; }

  .menu-btn {
    display: none; position: absolute; top: 8px; left: 8px; z-index: 21;
    height: 36px; padding: 0 16px; border: none; border-radius: 18px;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .menu-btn:active { background: #e94560; }
  .mobile-replay-btn {
    display: none; position: absolute; top: 8px; left: 92px; z-index: 21;
    height: 36px; padding: 0 10px; border: none; border-radius: 18px;
    background: rgba(233,69,96,0.85); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 2px 8px rgba(233,69,96,0.3);
  }
  .mobile-replay-btn:active { background: #c73659; }
  .sidebar-backdrop {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45); z-index: 99;
  }
  .sidebar-backdrop.show { display: block; }

  .title-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%);
    padding: 14px 50px 20px 24px; pointer-events: none;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .title-bar.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  .title-bar .tb-song {
    font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 2px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .title-bar .tb-info {
    font-size: 13px; color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .tb-toggle {
    pointer-events: auto; position: absolute; right: 12px; top: 10px;
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
    font-size: 13px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.2s;
  }
  .tb-toggle:hover { background: rgba(255,255,255,0.3); }

  .show-title-btn {
    position: absolute; top: 8px; right: 8px; z-index: 19;
    height: 30px; padding: 0 14px; border: none; border-radius: 15px;
    background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85);
    font-size: 12px; cursor: pointer; display: none; align-items: center;
    white-space: nowrap; transition: background 0.2s;
  }
  .show-title-btn:hover { background: rgba(0,0,0,0.75); }
  .show-title-btn.visible { display: flex; }

  /* 曲谱容器 */
  .score-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .score-page {
    position: absolute; top: 50%; left: 50%;
    background: #fff;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    transition: transform 0.15s ease-out;
    box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    display: none;
  }
  .score-page.active { display: block; }
  .score-page img {
    display: block; max-width: none; max-height: none; pointer-events: none;
  }
  .highlight-layer {
    position: absolute; top: 0; left: 0; pointer-events: none;
  }
  .highlight-layer.interactive { pointer-events: auto; }
  .highlight-rect {
    fill: rgba(255, 220, 50, 0.45);
    stroke: rgba(255, 180, 0, 0.6); stroke-width: 1;
  }
  .cover-rect { fill: #ffffff; stroke: none; }
  .highlight-rect.drawing, .cover-rect.drawing {
    stroke: rgba(255, 100, 100, 0.8); stroke-width: 1.5; stroke-dasharray: 4,2;
  }
  .bottom-pad { width: 100%; background: #fff; }

  .toolbar {
    height: 52px; flex-shrink: 0;
    background: rgba(20,20,20,0.95);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    padding: 0 50px 0 20px; gap: 10px; position: relative;
    transition: transform 0.25s ease, opacity 0.25s ease;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; position: absolute; bottom: 0; left: 0; right: 0; }
  .tb-toolbar-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
    font-size: 13px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.2s;
    flex-shrink: 0;
  }
  .tb-toolbar-toggle:hover { background: rgba(255,255,255,0.25); }

  .show-toolbar-btn {
    position: absolute; bottom: 8px; right: 8px; z-index: 19;
    height: 30px; padding: 0 14px; border: none; border-radius: 15px;
    background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85);
    font-size: 12px; cursor: pointer; display: none; align-items: center;
    white-space: nowrap; transition: background 0.2s;
  }
  .show-toolbar-btn:hover { background: rgba(0,0,0,0.75); }
  .show-toolbar-btn.visible { display: flex; }
  .toolbar button {
    height: 36px; min-width: 36px; padding: 0 10px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.1); color: #fff; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .toolbar button:active { background: rgba(233,69,96,0.4); }
  .toolbar button.active { background: #e94560; color: #fff; }
  .toolbar button.cover-active { background: #333; color: #fff; border: 1px solid #fff; }
  .toolbar .zoom-label {
    color: rgba(255,255,255,0.7); font-size: 13px; min-width: 48px; text-align: center; flex-shrink: 0;
  }
  .toolbar .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.15); margin: 0 4px; flex-shrink: 0; }

  .song-list::-webkit-scrollbar { width: 4px; }
  .song-list::-webkit-scrollbar-track { background: transparent; }
  .song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  /* 直播回放区域 - 侧边栏底部 */
  .replay-section {
    flex-shrink: 0; padding: 8px; border-top: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.2);
  }
  .replay-btn {
    width: 100%; padding: 10px 8px; border: none; border-radius: 6px;
    background: linear-gradient(135deg, #e94560 0%, #c73659 100%);
    color: #fff; font-size: calc(var(--sb-w) * 0.085); font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(233,69,96,0.3);
  }
  .replay-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,69,96,0.4); }
  .replay-btn:active { transform: translateY(0); background: #c73659; }

  /* 视频弹窗 */
  .video-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 10000;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .video-modal.open { display: flex; }
  .video-modal-inner {
    width: 100%; max-width: 900px; background: #000; border-radius: 10px;
    overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
  }
  .video-modal-head {
    padding: 14px 18px; background: #1a1a2e; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .video-modal-head h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .video-modal-close {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .video-modal-close:hover { background: #e94560; }
  .video-player-wrap {
    position: relative; width: 100%; padding-top: 56.25%; background: #000;
  }
  .video-player-wrap iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: none;
  }
  .video-list-panel {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 10001;
    align-items: center; justify-content: center; padding: 20px;
  }
  .video-list-panel.open { display: flex; }
  .video-list-inner {
    width: 100%; max-width: 500px; max-height: 80vh; background: #1a1a2e;
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .video-list-head {
    padding: 14px 18px; background: #16213e; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .video-list-head h3 { font-size: 16px; font-weight: 600; }
  .video-list-tip {
    padding: 12px 16px; background: rgba(233,69,96,0.15);
    color: #ff8fa3; font-size: 15px; font-weight: 600; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .video-list-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .video-item {
    padding: 12px 14px; margin: 4px 0; border-radius: 8px;
    background: rgba(255,255,255,0.05); cursor: pointer;
    transition: background 0.15s;
  }
  .video-item:hover { background: rgba(233,69,96,0.2); }
  .video-item .vi-name { color: #fff; font-size: 14px; font-weight: 600; }
  .video-item .vi-meta { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }

  /* ===== 手机端适配 ===== */
  /* ===== 直播工具箱（仅电脑版，Ctrl+H 开关） ===== */
  .tb-resizer {
    width: 6px; flex-shrink: 0; cursor: col-resize; display: none;
    background: rgba(233,69,96,0.35); position: relative; z-index: 50;
  }
  .tb-resizer:hover, .tb-resizer.dragging { background: #e94560; }
  .tb-resizer::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 18px; height: 44px; border-radius: 9px;
    background: rgba(255,255,255,0.25);
  }
  .tb-panel {
    display: none; flex-direction: column; flex-shrink: 0;
    width: 380px; min-width: 280px; max-width: 60vw;
    height: 100vh; height: 100dvh;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; overflow: hidden; z-index: 90; user-select: none;
  }
  body.tb-on .tb-panel { display: flex; }
  body.tb-on .tb-resizer { display: block; }
  body.tb-on .sidebar { display: none; }
  body.tb-on .resizer { display: none; }

  .tb-rows { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 6px 4px; }
  .tb-row { padding: 10px 14px; flex: 1 1 0; min-height: 58px; overflow: hidden; }
  .tb-split { display: flex; align-items: stretch; }
  .tb-half { flex: 1 1 0; min-width: 0; padding: 0 12px; }
  .tb-rh { height: 6px; flex-shrink: 0; cursor: row-resize; margin: 0 12px; border-radius: 3px; background: rgba(255,255,255,0.12); }
  .tb-rh:hover, .tb-rh.dragging { background: #e94560; }
  .tb-cv { width: 6px; flex-shrink: 0; cursor: col-resize; align-self: stretch; margin: 10px 0; border-radius: 3px; background: rgba(255,255,255,0.12); }
  .tb-cv:hover, .tb-cv.dragging { background: #e94560; }

  .tb-label { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
  .tb-label.red { color: #ff7a90; }
  .tb-time { font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tb-time.over { color: #ff4d6a; }
  .tb-name { font-size: 24px; font-weight: 800; color: #fff; line-height: 1.2; }
  .tb-name.over { color: #ff4d6a; }
  .tb-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .tb-word { font-size: 21px; font-weight: 700; color: #fff; line-height: 1.45; margin-top: 6px; white-space: pre-wrap; }
  .tb-word.editable { cursor: pointer; }
  .tb-word.editable:hover { color: #ffd7de; }

  .tb-btn {
    flex: 1; min-width: 70px; padding: 9px 4px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; background: rgba(255,255,255,0.06); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    font-family: inherit; transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.15); }
  .tb-btn.primary { background: #e94560; border-color: #e94560; }
  .tb-btn.primary:hover { background: #d6385a; }
  .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 悬浮小工具板 */
  .tb-float {
    display: none; position: fixed; top: 80px; right: 20px; z-index: 300;
    width: 190px; min-width: 140px; max-width: 320px;
    background: rgba(20,20,38,0.92); border: 1px solid rgba(233,69,96,0.5);
    border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); overflow: hidden;
  }
  .tb-float-resize {
    position: absolute; width: 14px; height: 14px; z-index: 10;
  }
  .tb-float-resize::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(233,69,96,0.5);
  }
  .tb-float-resize:hover::after { background: rgba(233,69,96,0.9); }
  .tb-float-resize.tb-fr { bottom: 0; right: 0; cursor: nwse-resize; }
  .tb-float-resize.tb-fl { bottom: 0; left: 0; cursor: nesw-resize; }
  .tb-float-resize.tb-tr { top: 0; right: 0; cursor: nesw-resize; }
  .tb-float-resize.tb-tl { top: 0; left: 0; cursor: nwse-resize; }
  body.tb-on .tb-float { display: block; }
  .tb-float-head {
    padding: 8px 12px; background: rgba(233,69,96,0.85); color: #fff;
    font-size: 13px; font-weight: 700; cursor: move; text-align: center;
  }
  .tb-float-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tb-float-body .tb-btn { min-width: 0; padding: 8px 4px; font-size: 12px; }

  /* 工具箱弹窗 */
  
  .tb-modal {
    display: none; position: fixed; z-index: 350;
    /* 位置由 JS 根据 tb-float 动态计算 */
  }
  .tb-modal.open { display: block; }
  .tb-modal-box {
    width: 280px; max-width: 80vw; max-height: 70vh; overflow-y: auto;
    background: rgba(20,20,38,0.96); border: 1px solid rgba(233,69,96,0.6);
    border-radius: 10px; padding: 14px; color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .tb-modal-box h3 { font-size: 18px; color: #e94560; margin-bottom: 14px; }
  .tb-modal-box h4 { font-size: 14px; color: rgba(255,255,255,0.75); margin: 14px 0 8px; }
  .tb-opt {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .tb-opt:hover { background: rgba(255,255,255,0.13); }
  .tb-opt.sel { background: #e94560; border-color: #e94560; font-weight: 700; }
  .tb-min-input {
    width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  .tb-modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  .tb-modal-btns button {
    padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; font-family: inherit;
  }
  .tb-modal-btns .cancel { background: rgba(255,255,255,0.15); color: #fff; }

    var ws = getWrapperSize();

    var maxPanY = Math.max(0, (ws.h * currentScale - viewArea.clientHeight) / 2);
    panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
    panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
  }

  function svgEl(name, attrs) {

  function fitToView() {
    var img = scoreImage();
    if (!img || !img.naturalWidth) return;
    // 手机端需要减去工具栏和歌名栏占用的高度，确保整张谱可见
    var availW = viewArea.clientWidth;
    var availH = viewArea.clientHeight;
    if (isMobile) {
      var tb = document.getElementById('toolbar');
      var titlebar = document.getElementById('titleBar');
      availH = viewArea.clientHeight;
    }
    var padH = bottomPad().offsetHeight;
    var imgH = img.naturalHeight + padH;
    var scaleW = availW / img.naturalWidth;
    var scaleH = availH / imgH;
    currentScale = Math.min(scaleW, scaleH) * 0.96;
    panX = 0; panY = 0;
    updateTransform(true);
  }

  function fillView() {
    var img = scoreImage();
    if (!img.naturalWidth) return;
    currentScale = viewArea.clientWidth / img.naturalWidth;
    panX = 0;
    var ws = getWrapperSize();
    var scaledH = ws.h * currentScale;
    panY = (scaledH - viewArea.clientHeight) / 2;
    if (scaledH <= viewArea.clientHeight) {
      panY = (viewArea.clientHeight - scaledH) / 2 * -1;
    }
    updateTransform(true);
  }

  viewArea.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (currentMode !== 'pan') return;
    var delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
    var step = currentScale > 2 ? ZOOM_STEP * 1.5 : ZOOM_STEP;
    currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, currentScale + delta * (delta > 0 ? step : step)));
    clampPan(); updateTransform(false);
  }, { passive: false });

  viewArea.addEventListener('mousedown', function(e) {
    if (currentMode === 'annotate' || currentMode === 'cover') {
      e.preventDefault();
      var pt = screenToSvg(e.clientX, e.clientY);
      drawStartX = pt.x; drawStartY = pt.y;
      isDrawing = true;
      var cls = currentMode === 'cover' ? 'cover-rect drawing' : 'highlight-rect drawing';
      currentRect = svgEl('rect', { x: pt.x, y: pt.y, width: 0, height: 0, class: cls });
      highlightLayer().appendChild(currentRect);
    } else {
      isDragging = true;
      viewArea.classList.add('dragging');
      dragStartX = e.clientX; dragStartY = e.clientY;

      currentRect.setAttribute('x', Math.min(drawStartX, pt.x));
      currentRect.setAttribute('y', Math.min(drawStartY, pt.y));
      currentRect.setAttribute('width', Math.abs(pt.x - drawStartX));
      currentRect.setAttribute('height', Math.abs(pt.y - drawStartY));
    } else if (isDragging) {
      panX = dragPanStartX + (e.clientX - dragStartX);
      panY = dragPanStartY + (e.clientY - dragStartY);

      var x = parseFloat(currentRect.getAttribute('x'));
      var y = parseFloat(currentRect.getAttribute('y'));
      currentRect.remove();
      if (w > 5 && h > 5) {
        var rect = { x: x, y: y, w: w, h: h };
        if (currentMode === 'cover') { covers[currentSongIndex].push(rect); }
        else { highlights[currentSongIndex].push(rect); }

      currentRect.setAttribute('x', Math.min(touchDrawStart.x, pt.x));
      currentRect.setAttribute('y', Math.min(touchDrawStart.y, pt.y));
      currentRect.setAttribute('width', Math.abs(pt.x - touchDrawStart.x));
      currentRect.setAttribute('height', Math.abs(pt.y - touchDrawStart.y));

    } else if (e.touches.length === 1 && isDragging) {
      panX = dragPanStartX + (e.touches[0].clientX - dragStartX);

      lastTouchDist = dist; clampPan(); updateTransform(false); e.preventDefault();

  function undo() {

    if (e.key === 'c' && !e.ctrlKey && !e.metaKey) { setMode(currentMode === 'annotate' ? 'pan' : 'annotate'); }
    if (e.key === 'k' && !e.ctrlKey && !e.metaKey) { setMode(currentMode === 'cover' ? 'pan' : 'cover'); }

  // 自动下滑功能
  var isAutoScrolling = false;
  var scrollSpeed = 1;
  var autoScrollTimer = null;

  function toggleAutoScroll() {
    console.log('toggleAutoScroll called, current isAutoScrolling:', isAutoScrolling);
    isAutoScrolling = !isAutoScrolling;
    if (isAutoScrolling) {
      btnAutoScroll.textContent = '⏸ 暂停';
      btnAutoScroll.style.background = 'rgba(255,140,0,0.85)';
      // 开始下滑前，先跳到顶部
      var ws = getWrapperSize();
      var maxPanY = Math.max(0, (ws.h * currentScale - viewArea.clientHeight) / 2);
      console.log('ws.h:', ws.h, 'currentScale:', currentScale, 'viewArea.clientHeight:', viewArea.clientHeight, 'maxPanY:', maxPanY);
      panY = maxPanY;
      clampPan();
      updateTransform(true);
      console.log('panY set to:', panY, 'starting auto scroll');
      startAutoScroll();
    } else {
      btnAutoScroll.textContent = '▼ 下滑';
      btnAutoScroll.style.background = 'rgba(76,175,80,0.7)';
      stopAutoScroll();
    }
  }

  function startAutoScroll() {
    if (autoScrollTimer) return;
    var lastTime = Date.now();
    function scrollStep() {
      if (!isAutoScrolling) return;
      var now = Date.now();
      var delta = now - lastTime;
      lastTime = now;
      var scrollAmount = scrollSpeed * delta * 0.05;
      // 减小panY实现向下滚动（图片向上移动）
      panY -= scrollAmount;
      clampPan();
      updateTransform(false);
      autoScrollTimer = requestAnimationFrame(scrollStep);
    }
    autoScrollTimer = requestAnimationFrame(scrollStep);
  }

  function stopAutoScroll() {
    if (autoScrollTimer) {
      cancelAnimationFrame(autoScrollTimer);
      autoScrollTimer = null;
    }
  }

  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtMM(sec) {
    var neg = sec < 0; sec = Math.abs(Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (neg ? '-' : '') + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtHM(ts) {
    var d = new Date(ts);
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  function tbMktRemainSec() {
    var cycle = tbState.mktInterval * 60;
    if (!tbState.liveStart && !tbState.liveAccum) return cycle;
    var elapsedSec = tbLiveElapsed() / 1000;
    var startSec = tbState.mktStart / 1000;
    var rem = cycle - (elapsedSec - startSec) % cycle;
    if (rem <= 0) rem = cycle;
    return rem;
  }
  function tbBeep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (var i = 0; i < 3; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        var t = ctx.currentTime + i * 0.5;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      }
    } catch (e) {}
  }

      customBtn.classList.add('sel');
      customBox.style.display = 'block';
      customOk.style.display = '';
      document.getElementById('tbCustomAlarmText').focus();
    });
    customOk.addEventListener('click', function() {
      var txt = document.getElementById('tbCustomAlarmText').value.trim();
      if (!txt) { alert('请输入报警内容'); return; }
      closeTbModal();
      showAlarm(txt);
    });
  }

  // ===== 渲染 =====
  function tbRender() {
    document.getElementById('tbLiveTime').textContent = fmtClock(tbLiveElapsed() / 1000);
    document.getElementById('tbMktIntervalShow').textContent = tbState.mktInterval;
    document.getElementById('tbContentWord').textContent = tbContentWord;
    document.getElementById('tbMktWord').textContent = tbMktWord;
    tbApplySizes();
    var liveBtn = document.querySelector('#tbFloat [data-fb="live"]');
    if (liveBtn) liveBtn.textContent = tbState.liveRunning ? '暂停' : ((tbState.liveAccum || tbState.liveStart) ? '继续' : '开播/暂停');

    var mktRemain = tbMktRemainSec();
    var mktEl = document.getElementById('tbMktTime');
    // 倒计时≤3秒进入“该营销了”状态
    if (mktRemain <= 3 && (tbState.liveStart || tbState.liveAccum)) {
      tbState.mktDue = true;
    }
    // 重置后倒计时回到>60秒，退出“该营销了”状态
    if (mktRemain > 60) {
      tbState.mktDue = false;
    }
    if (tbState.mktDue) {
      mktEl.textContent = '该营销了';
      mktEl.classList.add('over');
      if (!tbState.mktNotified && tbState.liveRunning) { tbState.mktNotified = true; tbBeep(); tbSave(); }
    } else {
      mktEl.textContent = fmtMM(mktRemain);
      mktEl.classList.toggle('over', mktRemain < 60);
      if (mktRemain > 60) tbState.mktNotified = false;
    }

    var curName = document.getElementById('tbCurName'), curTime = document.getElementById('tbCurTime');
    var nextName = document.getElementById('tbNextName'), nextTime = document.getElementById('tbNextTime');
    if (tbState.cur) {
      var curRemain = tbState.cur.mins * 60 - (tbLiveElapsed() - (tbState.cur.liveBase || 0)) / 1000;
      curName.textContent = tbState.cur.name;
      var curOver = curRemain < 0;
      curName.classList.toggle('over', curOver);
      curTime.textContent = (curOver ? '超时 ' : '') + fmtMM(curRemain);
      curTime.classList.toggle('over', curOver);
    } else {
      curName.textContent = '未设置'; curName.classList.remove('over');
      curTime.textContent = '--:--'; curTime.classList.remove('over');
    }
    if (tbState.next) {
      nextName.textContent = tbState.next.name;
      nextName.classList.remove('over');
      nextTime.textContent = tbState.next.mins + '分钟';
      nextTime.classList.remove('over');
    } else {
      nextName.textContent = '未设置'; nextName.classList.remove('over');
      nextTime.textContent = '--:--'; nextTime.classList.remove('over');
    }
  }

  // ===== 事件绑定 =====
  document.getElementById('tbContentWord').addEventListener('click', openWords);
  document.getElementById('tbMktWord').addEventListener('click', openWords);

  // 右侧每行大小调整（横向手柄调行高、竖手柄调左右占比），比例自动保存
  function tbSaveLayout() {
    var lay = { rows: [], cols: {} };
    for (var i = 1; i <= 4; i++) {
      var r = document.getElementById('tbRow' + i);
      lay.rows.push(r ? (parseFloat(r.style.flexGrow) || 1) : 1);
    }
    [1, 2].forEach(function(n) {
      var a = document.getElementById('tbR' + n + 'c1'), b = document.getElementById('tbR' + n + 'c2');
      if (a && b) lay.cols['r' + n] = [parseFloat(a.style.flexGrow) || 1, parseFloat(b.style.flexGrow) || 1];
    });
    tbState.layout = lay;
    tbSave();
  }
  function tbSetScale(key, v) {
    v = Math.max(0.7, Math.min(1.8, Math.round(v * 100) / 100));
    tbState.scales[key] = v;
  }
  function tbApplySizes() {
    var S = tbState.scales || {};
    function px(key, base) { return Math.round(base * (S[key] || 1)) + 'px'; }
    function set(id, v) { var el = document.getElementById(id); if (el) el.style.fontSize = v; }
    set('tbLiveTime', px('live', 30));
    set('tbMktTime', px('mkt', 30));
    set('tbCurName', px('cur', 24));
    set('tbCurTime', px('cur', 30));
    set('tbNextName', px('next', 24));
    set('tbNextTime', px('next', 30));
    set('tbContentWord', (tbState.sizes.content || 22) + 'px');
    set('tbMktWord', (tbState.sizes.mkt || 22) + 'px');
  }

  // 字号一键预设
  var tbFontPresets = [
    { name:'默认', scales:{live:1,mkt:1,cur:1,next:1}, sizes:{content:22,mkt:22} },
    { name:'大',   scales:{live:1.25,mkt:1.25,cur:1.25,next:1.25}, sizes:{content:28,mkt:28} },
    { name:'超大', scales:{live:1.5,mkt:1.5,cur:1.5,next:1.5}, sizes:{content:34,mkt:34} },
    { name:'特大', scales:{live:1.8,mkt:1.8,cur:1.8,next:1.8}, sizes:{content:40,mkt:40} }
  ];
  document.querySelectorAll('.tb-font-preset').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var lv = parseInt(btn.getAttribute('data-level'));
      var p = tbFontPresets[lv];
      if (!p) return;
      tbState.scales.live = p.scales.live;
      tbState.scales.mkt = p.scales.mkt;
      tbState.scales.cur = p.scales.cur;
      tbState.scales.next = p.scales.next;
      tbState.sizes.content = p.sizes.content;
      tbState.sizes.mkt = p.sizes.mkt;
      tbApplySizes();
      tbSave();
      // 高亮当前选中
      document.querySelectorAll('.tb-font-preset').forEach(function(b) {
        b.style.background = ''; b.style.borderColor = '';
      });
      btn.style.background = '#e94560';
      btn.style.borderColor = '#e94560';
    });
  });
  // 初始化高亮当前预设
  function tbHighlightFontPreset() {
    var cs = tbState.scales.live || 1;
    var idx = 0;
    if (cs >= 1.7) idx = 3;
    else if (cs >= 1.4) idx = 2;
    else if (cs >= 1.15) idx = 1;
    document.querySelectorAll('.tb-font-preset').forEach(function(b, i) {
      if (i === idx) { b.style.background = '#e94560'; b.style.borderColor = '#e94560'; }
      else { b.style.background = ''; b.style.borderColor = ''; }
    });
  }
  function tbApplyLayout() {
    var lay = tbState.layout;
    if (!lay) return;
    if (lay.rows) for (var i = 0; i < 4; i++) {
      var r = document.getElementById('tbRow' + (i + 1));
      if (r && lay.rows[i]) r.style.flexGrow = lay.rows[i];
    }
    if (lay.cols) [1, 2].forEach(function(n) {
      var c = lay.cols['r' + n];
      if (!c) return;
      var a = document.getElementById('tbR' + n + 'c1'), b = document.getElementById('tbR' + n + 'c2');
      if (a && b) { a.style.flexGrow = c[0]; b.style.flexGrow = c[1]; }
    });
    tbApplySizes();
  }

  // 双击任意半屏 → 弹出字号小工具条
  var tbSizer = document.getElementById('tbSizer');
  var tbSizerKey = null;
  function tbOpenSizer(key, name, x, y) {
    tbSizerKey = key;
    document.getElementById('tbSizerName').textContent = name;
    tbRefreshSizer();
    tbSizer.style.left = Math.max(8, Math.min(x, window.innerWidth - 240)) + 'px';
    tbSizer.style.top = Math.max(8, Math.min(y, window.innerHeight - 70)) + 'px';
    tbSizer.classList.add('open');
  }
  function tbCloseSizer() { tbSizer.classList.remove('open'); tbSizerKey = null; }
  function tbRefreshSizer() {
    if (!tbSizerKey) return;
    document.getElementById('tbSizerVal').textContent = Math.round((tbState.scales[tbSizerKey] || 1) * 100) + '%';
  }
  document.getElementById('tbSizerUp').addEventListener('click', function() {
    if (!tbSizerKey) return;
    tbSetScale(tbSizerKey, (tbState.scales[tbSizerKey] || 1) + 0.1);
    tbSave(); tbApplySizes(); tbRefreshSizer();
  });
  document.getElementById('tbSizerDown').addEventListener('click', function() {
    if (!tbSizerKey) return;
    tbSetScale(tbSizerKey, (tbState.scales[tbSizerKey] || 1) - 0.1);
    tbSave(); tbApplySizes(); tbRefreshSizer();
  });
  document.addEventListener('mousedown', function(e) {
    if (tbSizer.classList.contains('open') && !tbSizer.contains(e.target) && !e.target.closest('.tb-half')) tbCloseSizer();
  });
  [
    ['live', '已播时间', 'tbR1c1'],
    ['mkt', '营销倒计时', 'tbR1c2'],
    ['cur', '当前环节', 'tbR2c1'],
    ['next', '下一环节', 'tbR2c2']
  ].forEach(function(item) {
    var el = document.getElementById(item[2]);
    if (!el) return;
    el.addEventListener('dblclick', function(e) {
      e.preventDefault(); e.stopPropagation();
      tbPushHistory();
      tbOpenSizer(item[0], item[1] + '字号', e.clientX, e.clientY);
    });
  });
  (function() {
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    // targets: [{key, kind:'scale'|'px', base, getEl}]，拖动时字号随框大小联动
    function bindDrag(handle, elA, elB, vertical, targets) {
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        var dragging = true;
        handle.classList.add('dragging');
        document.body.style.cursor = vertical ? 'row-resize' : 'col-resize';
        var startPos = vertical ? e.clientY : e.clientX;
        var sizeA0 = vertical ? elA.offsetHeight : elA.offsetWidth;
        var sizeB0 = vertical ? elB.offsetHeight : elB.offsetWidth;
        var total = sizeA0 + sizeB0;
        var MIN = vertical ? 46 : 80;
        var snap = targets.map(function(t) {
          return { t: t, s0: (vertical ? t.getEl().offsetHeight : t.getEl().offsetWidth) || (vertical ? 80 : 150) };
        });
        function move(ev) {
          if (!dragging) return;
          var d = (vertical ? ev.clientY : ev.clientX) - startPos;
          var na = clamp(sizeA0 + d, MIN, total - MIN);
          var nb = total - na;
          elA.style.flexGrow = na;
          elB.style.flexGrow = nb;
          snap.forEach(function(s) {
            var cur = vertical ? s.t.getEl().offsetHeight : s.t.getEl().offsetWidth;
            var r = cur / s.s0;
            r = clamp(r, 0.7, 1.8);
            if (s.t.kind === 'px') {
              tbState.sizes[s.t.key] = Math.round(clamp(s.t.base * r, 14, 40));
            } else {
              tbSetScale(s.t.key, (tbState.scales[s.t.key] || 1) * (1 + (r - 1) * 0.8));
            }
            s.s0 = cur;
          });
          tbApplySizes();
        }
        function up() {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('dragging');
          document.body.style.cursor = '';
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          tbSaveLayout(); tbSave();
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    }
    function halfEl(n, c) { return document.getElementById('tbR' + n + 'c' + c); }
    // 行高手柄：上下两行动字体（话术框用px字号，时间/环节用scale）
    document.querySelectorAll('.tb-rh').forEach(function(h) {
      var n = parseInt(h.dataset.row, 1);
      var rowA = document.getElementById('tbRow' + n), rowB = document.getElementById('tbRow' + (n + 1));
      var targets = [];
      function rowTargets(row, cw) {
        if (row === 'tbRow3') targets.push({ key: 'content', kind: 'px', base: tbState.sizes.content || 22, getEl: function() { return document.getElementById('tbContentWord'); } });
        if (row === 'tbRow4') targets.push({ key: 'mkt', kind: 'px', base: tbState.sizes.mkt || 22, getEl: function() { return document.getElementById('tbMktWord'); } });
        if (row === 'tbRow1') {
          targets.push({ key: 'live', kind: 'scale', getEl: function() { return document.getElementById('tbLiveTime'); } });
          targets.push({ key: 'mkt', kind: 'scale', getEl: function() { return document.getElementById('tbMktTime'); } });
        }
        if (row === 'tbRow2') {
          targets.push({ key: 'cur', kind: 'scale', getEl: function() { return document.getElementById('tbCurTime'); } });
          targets.push({ key: 'next', kind: 'scale', getEl: function() { return document.getElementById('tbNextTime'); } });
        }
      }
      rowTargets('tbRow' + n); rowTargets('tbRow' + (n + 1));
      bindDrag(h, rowA, rowB, true, targets);
    });
    // 列宽手柄：该排左右两联动
    [1, 2].forEach(function(n) {
      var row = document.getElementById('tbRow' + n);
      var cv = row.querySelector('.tb-cv');
      if (!cv) return;
      var targets;
      if (n === 1) {
        targets = [
          { key: 'live', kind: 'scale', getEl: function() { return halfEl(1, 1); } },
          { key: 'mkt', kind: 'scale', getEl: function() { return halfEl(1, 2); } }
        ];
      } else {
        targets = [
          { key: 'cur', kind: 'scale', getEl: function() { return halfEl(2, 1); } },
          { key: 'next', kind: 'scale', getEl: function() { return halfEl(2, 2); } }
        ];
      }
      bindDrag(cv, halfEl(n, 1), halfEl(n, 2), false, targets);
    });
  })();

  document.querySelectorAll('#tbFloat [data-fb]').forEach(function(b) {
    b.addEventListener('click', function() {
      var act = b.dataset.fb;
      if (act === 'live') tbToggleLive(false);
      else if (act === 'change') openChange();
      else if (act === 'cur') openSetStep('cur');
      else if (act === 'next') openSetStep('next');
      else if (act === 'mkt') mktReset();
      else if (act === 'word') openWords();
      else if (act === 'reset') tbLiveReset();
      else if (act === 'alarm') openAlarmPicker();
    });
  });

  // 悬浮窗拖动
  (function() {
    var head = document.getElementById('tbFloatHead'), float = document.getElementById('tbFloat');
    var dragging = false, ox = 0, oy = 0;
    head.addEventListener('mousedown', function(e) {
      dragging = true;
      var r = float.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      float.style.right = 'auto'; e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var x = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - ox));
      var y = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - oy));
      float.style.left = x + 'px'; float.style.top = y + 'px';
      if (typeof positionModalNearFloat === 'function') positionModalNearFloat();
    });
    document.addEventListener('mouseup', function() { dragging = false; });
  })();

  // 悬浮窗四角调整大小
  (function() {
    var floatEl = document.getElementById('tbFloat');
    var resizing = false, corner = '', startX = 0, startY = 0, startW = 0, startH = 0, startL = 0, startT = 0;
    var minW = 140, maxW = 360, minH = 180, maxH = 600;
    document.querySelectorAll('.tb-float-resize').forEach(function(h) {
      h.addEventListener('mousedown', function(e) {
        resizing = true; corner = h.dataset.corner;
        startX = e.clientX; startY = e.clientY;
        startW = floatEl.offsetWidth; startH = floatEl.offsetHeight;
        startL = floatEl.offsetLeft; startT = floatEl.offsetTop;
        e.preventDefault(); e.stopPropagation();
      });
    });
    document.addEventListener('mousemove', function(e) {
      if (!resizing) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      var nw = startW, nh = startH, nl = startL, nt = startT;
      if (corner === 'br') { nw = startW + dx; nh = startH + dy; }
      else if (corner === 'bl') { nw = startW - dx; nh = startH + dy; nl = startL + dx; }
      else if (corner === 'tr') { nw = startW + dx; nh = startH - dy; nt = startT + dy; }
      else if (corner === 'tl') { nw = startW - dx; nh = startH - dy; nl = startL + dx; nt = startT + dy; }
      nw = Math.max(minW, Math.min(maxW, nw));
      nh = Math.max(minH, Math.min(maxH, nh));
      floatEl.style.width = nw + 'px'; floatEl.style.height = nh + 'px';
      if (corner === 'bl' || corner === 'tl') floatEl.style.left = nl + 'px';
      if (corner === 'tr' || corner === 'tl') floatEl.style.top = nt + 'px';
      floatEl.style.right = 'auto';
      if (typeof positionModalNearFloat === 'function') positionModalNearFloat();
    });
    document.addEventListener('mouseup', function() { resizing = false; });
  })();

  // 工具箱尺寸拖动（面板大小 + 字号联动缩放）
  (function() {
    var rz = document.getElementById('tbResizer'), dragging = false, initSize = 0, baseScales = null, baseSizes = null;
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    rz.addEventListener('mousedown', function(e) {
      if (window.innerWidth <= 768) return;
      dragging = true; rz.classList.add('dragging');
      var isBottom = document.body.classList.contains('tb-bottom');
      document.body.style.cursor = isBottom ? 'row-resize' : 'col-resize';
      e.preventDefault();
      initSize = isBottom ? tbPanel.offsetHeight : tbPanel.offsetWidth;
      baseScales = { live: tbState.scales.live, mkt: tbState.scales.mkt, cur: tbState.scales.cur, next: tbState.scales.next };
      baseSizes = { content: tbState.sizes.content, mkt: tbState.sizes.mkt };
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var isBottom = document.body.classList.contains('tb-bottom');
      var curSize, r;
      if (isBottom) {
        var h = Math.max(160, Math.min(window.innerHeight * 0.6, e.clientY));
        tbPanel.style.height = h + 'px';
        curSize = h;
      } else {
        var w = Math.max(280, Math.min(window.innerWidth * 0.6, window.innerWidth - e.clientX));
        tbPanel.style.width = w + 'px';
        curSize = w;
      }
      r = clamp(curSize / initSize, 0.5, 2.5);
      tbState.scales.live = clamp(baseScales.live * r, 0.5, 2.5);
      tbState.scales.mkt = clamp(baseScales.mkt * r, 0.5, 2.5);
      tbState.scales.cur = clamp(baseScales.cur * r, 0.5, 2.5);
      tbState.scales.next = clamp(baseScales.next * r, 0.5, 2.5);
      tbState.sizes.content = Math.round(clamp(baseSizes.content * r, 12, 48));
      tbState.sizes.mkt = Math.round(clamp(baseSizes.mkt * r, 12, 48));
      tbApplySizes();
      tbHighlightFontPreset();
    });
    document.addEventListener('mouseup', function() {
      if (dragging) { dragging = false; rz.classList.remove('dragging'); document.body.style.cursor = ''; tbSave(); }
    });
  })();


  // 工具箱位置切换（右/下）
  var tbPosBtn = document.getElementById('tbPosBtn');
  function tbLoadPos() {
    if (localStorage.getItem('tb-pos') === 'bottom') {
      document.body.classList.add('tb-bottom');
    }
  }
  function tbTogglePos() {
    document.body.classList.toggle('tb-bottom');
    localStorage.setItem('tb-pos', document.body.classList.contains('tb-bottom') ? 'bottom' : 'right');
    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 60);
  }
  tbPosBtn.addEventListener('click', tbTogglePos);
  tbLoadPos();

  // Ctrl+H 开关
  function tbToggle() {
    if (window.innerWidth <= 768) return;
    document.body.classList.toggle('tb-on');
    if (document.body.classList.contains('tb-on')) closeSidebar();
    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 60);
  }
  document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var inModal = tbModal.classList.contains('open');
    if (e.key === 'Escape') { tbCloseSizer(); }
    // Ctrl/Cmd + 组合键
    if (e.ctrlKey || e.metaKey) {
      var k = e.key.toLowerCase();
      if (k === 'h') { e.preventDefault(); tbToggle(); return; }
      if (k === 'z' && tag !== 'input' && tag !== 'textarea' && !inModal && document.body.classList.contains('tb-on')) {
        e.preventDefault(); tbUndo(); return;
      }
      return;
    }
    // 弹窗内回车 = 点确认（话术框里回车是换行，不触发）
    if (inModal && e.key === 'Enter' && tag !== 'textarea') {
      var ok = document.getElementById('tbStepOk') || document.getElementById('tbWordOk');
      if (ok) { e.preventDefault(); ok.click(); }
    }
  });

  tbLoad();
    tbHighlightFontPreset();
  tbApplyLayout();
  tbRender();

  // 初始化歌词按钮显示状态
  if (songs[0] && songs[0].lyrics) { btnLyrics.style.display = ''; }
  setInterval(tbRender, 1000);
</script>
